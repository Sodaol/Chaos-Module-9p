  const $=id=>document.getElementById(id); const hex=/0x[0-9a-fA-F]{4,16}(?:u|U|ul|UL|l|L)?\b/g;

  function addFile(name,text){let lines=text.split(/\r?\n/);lines.forEach((line,i)=>{let m;while((m=hex.exec(line))){let raw=m[0],a=clean(raw);if(ignored.has(a)||records.some(r=>r.file===name&&r.line===i+1&&r.address===a))continue;records.push({id:'scan-'+records.length,address:a,kind:classify(a,line),symbol:line.trim().slice(0,100),file:name,line:i+1,usage:'source literal',raw,seed:false})}hex.lastIndex=0});scannedFiles.push(name)}

  function label(k){return ({firmware:'Firmware',api:'API / Function',constant:'Constant',literal:'Literal'})[k]||k}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function updateSources(){let old=$('source').value,vals=[...new Set(records.map(r=>r.file))].sort();$('source').innerHTML='<option value="all">全部來源</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');$('source').value=vals.includes(old)?old:'all'}
  function download(name,type,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
  $('folder').onchange=e=>{records=[...seed];scannedFiles=[];[...e.target.files].forEach(f=>{if(/\.(rs|c|h|json|md|js|ts|tsx|jsx|py|ld|lua)$/i.test(f.name))f.text().then(t=>{addFile(f.webkitRelativePath||f.name,t);updateSources();refresh()})})};$('import').onclick=()=>$('folder').click();$('drop').onclick=()=>$('folder').click();$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');[...e.dataTransfer.files].forEach(f=>f.text().then(t=>{addFile(f.webkitRelativePath||f.name,t);updateSources();refresh()}))};['search','kind','source','duplicates'].forEach(id=>$(id).oninput=refresh);$('csv').onclick=()=>download('n67-offsets.csv','text/csv;charset=utf-8','address,kind,symbol,file,line,usage\n'+records.map(r=>[r.address,r.kind,r.symbol,r.file,r.line,r.usage].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'));$('json').onclick=()=>download('n67-offsets.json','application/json',JSON.stringify(records,null,2));updateSources();refresh();
